# Local use only (never on the server): publishes the services on 127.0.0.1 so the browser can
# reach them. Start it with `pnpm docker:dev`.
services:
  db:
    ports: ['127.0.0.1:5432:5432']

  api:
    ports: ['127.0.0.1:3000:3000']
    environment:
      PUBLIC_SITE_URL: http://localhost:8080
      # Uploaded images are served through the web container (see nginx.dev-proxy.conf).
      PUBLIC_API_URL: http://localhost:8080

  web:
    build:
      args:
        # Empty = same origin: the browser calls /api on the page's own host:port, and nginx
        # relays it to the api. Works the same on localhost:8080 and 127.0.0.1:8080.
        VITE_API_URL: ''
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./apps/web/nginx.dev-proxy.conf:/etc/nginx/dev/proxy.conf:ro
