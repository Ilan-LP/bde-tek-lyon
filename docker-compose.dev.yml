# Local use only (never on the server): adds the host ports that the real proxy makes unnecessary.
# "edge" stays external here too, exactly like in production: `pnpm docker:dev` creates it
# on your machine when it is missing, then starts the stack.
services:
  db:
    ports: ['127.0.0.1:5432:5432']

  api:
    ports: ['127.0.0.1:3000:3000']
    environment:
      # The site is served on :8080 here (CORS only allows PUBLIC_SITE_URL) and the browser
      # reaches the api directly on :3000.
      PUBLIC_SITE_URL: http://localhost:8080
      PUBLIC_API_URL: http://localhost:3000

  web:
    build:
      args:
        VITE_API_URL: http://localhost:3000
    ports: ['127.0.0.1:8080:8080']
