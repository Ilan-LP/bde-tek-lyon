# Local development only (mounted by docker-compose.dev.yml, never part of the image).
# Makes the site and the API share one origin, like behind the production reverse proxy:
# the browser only talks to :8080, whether the page is opened as localhost or 127.0.0.1.

# Docker's internal DNS. The name is resolved when a request comes in, so nginx starts
# even if the api container is not up yet.
resolver 127.0.0.11 valid=10s;

location /api/ {
    set $api http://bde-site-api:3000;
    proxy_pass $api;
    client_max_body_size 3m; # the api accepts images up to 2 MB (nginx's default would stop them at 1 MB)
}

location /uploads/ {
    set $api http://bde-site-api:3000;
    proxy_pass $api;
}
