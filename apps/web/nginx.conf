# Served by nginx-unprivileged: this file replaces conf.d/default.conf (http context, port 8080).

# Admin pages must stay out of search engines. $request_uri keeps the original URL even after
# the SPA fallback rewrites the request to /index.html. An empty value adds no header.
map $request_uri $robots_tag {
    ~^/admin  "noindex, nofollow";
    default   "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Basic security headers. Do not add add_header inside a location below: nginx would then
    # drop every header defined here (that is why caching uses `expires`, which does not).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_tag always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Container health check: cheap, no file access.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite names these files after their content (index-<hash>.js): safe to cache for a year.
    # A missing file must be a real 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Brand fonts keep their name, so a shorter cache.
    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    # The entry point is never cached: it is what points to the current hashed files.
    location = /index.html {
        expires -1; # Cache-Control: no-cache
    }

    # Local development only: docker-compose.dev.yml mounts a file here that proxies /api and /uploads
    # to the api (in production the reverse proxy does that). Without a file, this line does nothing.
    include /etc/nginx/dev/*.conf;

    # Single-page app: any other URL (/evenements, /admin/clubs...) is handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
